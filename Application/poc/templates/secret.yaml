{{- $fullName := include "poc.fullname" . }}
{{- range .Values.app.kvSecrets }}
apiVersion: spv.no/v2beta1
kind: AzureKeyVaultSecret
metadata:
  name: {{ printf "%s-%s" $fullName (. | lower | replace "_" "-") | trunc 63 | trimSuffix "-" }}
spec:
  vault:
    name: {{ $.Values.app.akvName | quote }}
    object:
      name: {{ . | quote }}
      type: secret
  output:
    secret:
      name: {{ . | quote }}
      dataKey: {{ . | quote }}
---
{{- end }}
{{- if .Values.app.Cert }}
apiVersion: spv.no/v2beta1
kind: AzureKeyVaultSecret
metadata:
  name: {{ printf "%s-certificate" $fullName | trunc 63 | trimSuffix "-" }}
spec:
  vault:
    name: {{ .Values.app.akvName | quote }}
    object:
      name: {{ .Values.app.Cert | quote }}
      type: certificate
  output:
    secret:
      name: {{ .Values.ingress.certName | quote }}
      type: kubernetes.io/tls
{{- end }}
