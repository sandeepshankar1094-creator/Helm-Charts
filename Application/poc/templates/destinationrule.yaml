{{- if .Values.ingress.enabled }}
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: {{ .Values.ingress.destinationRuleName }}
  labels:
    {{- include "poc.labels" . | nindent 4 }}
    {{- with .Values.app.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  host: {{ printf "%s.%s.svc.cluster.local" (include "poc.fullname" .) .Release.Namespace }}
{{- end }}
